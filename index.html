<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3eadb" />
  <title>TripToon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="panel">
      <div class="brand">
        <div class="brand-mark">TT</div>
        <div>
          <h1>TripToon</h1>
          <p>Animated journeys. Zero paid APIs.</p>
        </div>
      </div>

      <div class="section-title">Journey</div>
      <div id="stops" class="stops"></div>
      <button id="addStop" class="add-btn">＋ Add destination</button>

      <div class="section-title top-gap">Animation</div>
      <label class="range-label"><span>Duration</span><strong id="durationLabel">18s</strong></label>
      <input id="duration" class="range" type="range" min="2" max="45" value="18" step="1" />

      <div class="actions">
        <button id="playBtn" class="primary">▶ Play</button>
        <button id="resetBtn" class="secondary">↻ Reset</button>
      </div>
      <button id="exportBtn" class="export-btn">⇩ Export WebM</button>
      <p class="hint">Everything runs in the browser. No Google Maps, Mapbox, routing API, or API key.</p>
    </aside>

    <main class="stage-wrap">
      <div class="phone-frame">
        <svg id="mapSvg" class="map-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <rect width="1080" height="1920" fill="#f4f0e8" />
          <rect x="60" y="450" width="960" height="480" rx="26" fill="#dcecef" stroke="#a9c0c5" stroke-width="3"/>
          <g id="graticule" stroke="#ffffff" stroke-width="2" opacity="0.34"></g>
          <g id="continents" fill="#c8d2b4" stroke="#7d8f78" stroke-width="2.6" stroke-linejoin="round" opacity="0.98"></g>
          <text x="540" y="120" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="58" fill="#203742">MY JOURNEY</text>
          <text id="subtitle" x="540" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#61747c">TRIPTOON • 3 STOPS</text>
          <g id="routes"></g>
          <g id="markers"></g>
          <g id="vehicle"></g>
          <text x="540" y="1800" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#61747c">Made with TripToon • 100% local animation</text>
        </svg>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
